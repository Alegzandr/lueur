<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Lueur</title>
    <!-- Paints the right background on the very first frame, before the
         stylesheet lands, so the window never flashes the wrong colour. -->
    <style>
      html {
        background: #f8f6f2;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #1b1916;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
