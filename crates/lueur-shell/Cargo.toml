[package]
name = "lueur-shell"
description = "Lueur's desktop service: capture, the live loops, the bulbs, secrets and the commands, without any GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# Everything a window needs from the running app, whatever draws the window
# (Slint, in crates/lueur-slint). No interface framework is a dependency
# here; a front end plugs into `Shell` through the `Host` trait.

[dependencies]
lueur-core = { path = "../lueur-core" }
serde = { workspace = true }
serde_json = { workspace = true }
# The runtime the Tuya driver runs on.
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }

# Tuya / Smart Life (src/tuya.rs, src/tuya_cloud.rs). Local control goes
# through rustuya; the one-off Smart Life sign-in that hands over each bulb's
# local key is an HTTPS API whose payloads are signed and AES-GCM sealed.
rustuya = { version = "0.4.6", features = ["tokio"] }
ureq = { version = "3.5.0", features = ["json"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# The key that seals the credentials on disk (src/vault.rs), in the OS's own
# keyring: Credential Manager, Keychain, Secret Service.
keyring = "4.2.0"

# Cross-platform screen capture (Windows/macOS/Linux). See README for the
# capture-backend notes.
xcap = "0.9"
# The local time of day, for the natural light (src/natural.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
# Logs (src/logging.rs): the facade most of the tree already logs through,
# with a small logger of our own instead of a logging framework.
log = { version = "0.4.29", features = ["kv"] }
# Launch at login (src/autostart.rs). The crate the Tauri autostart plugin
# wraps, set up the same way, so both shells read and write the same login
# item and an update from one to the other keeps the user's choice.
auto-launch = "0.6"
# Updates (src/update.rs), checked as the Tauri updater plugin checks them:
# its minisign verifier, the version the Tauri version already builds, and
# semver to compare versions as it does. Both already in the tree through
# Tauri.
minisign-verify = "0.3"
semver = "1"

# Desktop Duplication and GDI capture (see src/capture/dxgi.rs, gdi.rs) and
# the SDR white of an HDR display, the capture benchmark's CPU time, the
# per-user install (src/install.rs) and one application's sound for the
# music show (src/audio/apps.rs), and keeping the computer awake for the
# sleep timer (src/awake.rs). Same `windows` version xcap already pulls in,
# so it adds no second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` of src/audio/apps.rs names it; the version `windows`
# itself uses.
windows-core = "0.100"
self-replace = "1.5"
winreg = "0.56"

# The computer's name other computers running Lueur show (src/peers.rs),
# and the bundle swap of a Mac update (src/update.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# An AppImage or a `.app` update is unpacked and swapped in as the Tauri
# updater plugin does it (src/update.rs), with the crates it uses: a
# private temporary folder beside the app, and the `.tar.gz` it ships in.
# All three already in the tree through Tauri.
tempfile = "3"
flate2 = "1"
tar = "0.4"

# Wayland capture through the ScreenCast portal (see src/capture/screencast.rs):
# the portal over D-Bus, its video over PipeWire. The versions xcap already
# pulls in on Linux, so neither adds a second copy.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "6.2"
pipewire = "0.10"
