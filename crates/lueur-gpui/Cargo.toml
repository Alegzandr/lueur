[package]
name = "lueur-gpui"
description = "Lueur's window, drawn with GPUI over lueur-shell."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# The release and the updater ship `lueur` (see .github/workflows/release.yml);
# Windows installs it as lueur-app.exe (lueur-shell's install.rs).
[[bin]]
name = "lueur"
path = "src/main.rs"

# The executable's icon and version on Windows (build.rs). The version GPUI
# already builds with.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dependencies]
lueur-core = { path = "../lueur-core" }
lueur-shell = { path = "../lueur-shell" }
serde = { workspace = true }
serde_json = { workspace = true }
log = { version = "0.4.29", features = ["kv"] }
gpui = { workspace = true }
gpui_platform = { workspace = true }
# The shell's events, from its worker threads to the window's thread.
async-channel = "2.5"
# The system's language, when the interface follows it. Already in the tree
# through GPUI.
sys-locale = "0.3"
# The tray icon's pixels.
image = { version = "0.25", default-features = false, features = ["png"] }
# Grapheme boundaries for the text field (src/ui/input.rs). Already in the
# tree through GPUI.
unicode-segmentation = "1.13"
# Ids for new lights (src/views/room/plan.rs), as the Tauri interface makes
# them. The version lueur-shell already uses.
uuid = { version = "1.29.0", features = ["v4"] }

# The tray: the crate Tauri's own tray uses, without Tauri. On Linux it needs
# a GTK loop of its own, which this shell does not run yet.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.25"

# One instance at a time, recognised by the Tauri version too (src/single.rs),
# and the Windows version for the caption glyphs (src/titlebar.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
# One instance at a time over the session bus, as the Tauri plugin does it
# (src/single.rs). The version lueur-shell already uses.
zbus = "5.17"
