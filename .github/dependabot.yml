version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  # The update signer (scripts/sign): the Tauri CLI and nothing else.
  - package-ecosystem: npm
    directory: /scripts/sign
    schedule:
      interval: weekly
  # The workflows pin actions by commit; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
