name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  # Lets a working branch be checked on all three systems before a pull
  # request exists, the only way to compile the Windows and macOS shells
  # when you are not on that system.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    # A release commit is tested by the Release workflow, which calls this one.
    if: github.workflow != 'CI' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: System dependencies
        run: ./scripts/linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: rustfmt
        run: cargo fmt --all --check
      # Also enforces the anti-cheat bans in clippy.toml.
      - name: clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # Known vulnerabilities in the locked dependencies. Ignored advisories, and
  # why, are in .cargo/audit.toml.
  audit:
    name: Dependency audit
    # A release commit is tested by the Release workflow, which calls this one.
    if: github.workflow != 'CI' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  test:
    name: Tests (${{ matrix.os }})
    # A release commit is tested by the Release workflow, which calls this one.
    if: github.workflow != 'CI' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'release:')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: System dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo test
        run: cargo test --workspace --locked

  # The AppImage and the Mac app, made as the release makes them but neither
  # signed nor published, so a change to their packaging is seen before a
  # release depends on it.
  package:
    name: Package (${{ matrix.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        run: ./scripts/linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Linux, AppImage
        if: matrix.name == 'linux'
        run: |
          cargo build --release --locked -p lueur-slint
          ./scripts/package-linux.sh 0.0.0 release
          ls -l release
      - name: macOS, universal app
        if: matrix.name == 'macos'
        run: |
          ./scripts/package-macos.sh 0.0.0 release
          ls -l release
