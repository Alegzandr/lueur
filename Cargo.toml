# Cargo workspace for Lueur.
#
# `lueur-core` is a dependency-light, GUI-free crate that holds all the logic
# we want to unit-test in isolation (room geometry, the Yeelight protocol,
# colour processing, the screen colour engine and config persistence).
#
# `lueur-shell` is the desktop service without a GUI: real screen capture,
# the bulbs on the network, the background workers, the updates and the
# commands a window calls. `lueur-slint` draws the window and the tray with
# Slint and stays thin, so the interesting, security-sensitive logic lives
# where it can be tested without a display server.
[workspace]
resolver = "2"
members = ["crates/lueur-core", "crates/lueur-shell", "crates/lueur-slint", "crates/lueur-sign"]

[workspace.package]
version = "0.20.1"
edition = "2024"
license = "MIT"
authors = ["Lueur contributors"]
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release builds optimise across crates: a smaller binary, and the frame loop
# inlines through the core crate. Slower to link, which only CI pays.
[profile.release]
lto = "thin"
codegen-units = 1
