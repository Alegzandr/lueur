[package]
name = "lueur"
description = "Lueur: one app for all your smart bulbs, whatever the brand, with care in every detail."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "lueur"

# The library the binary links.
[lib]
name = "lueur_lib"
crate-type = ["lib"]

[[bin]]
name = "lueur"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lueur-core = { path = "../crates/lueur-core" }
lueur-shell = { path = "../crates/lueur-shell" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The save and open dialogs of the config export and import, used from Rust
# only (no frontend permission).
tauri-plugin-dialog = "2"
# Opens the logs folder in the file manager, from Rust only (no frontend
# permission).
tauri-plugin-opener = "2"
# The updater's timer (a six hour sleep must not hold a thread).
tokio = { version = "1", features = ["time"] }
log = { version = "0.4.29", features = ["kv"] }

# The window border colour (src/titlebar.rs) and the in-place update of the
# installed executable (src/updater.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
self-replace = "1.5"

[dev-dependencies]
# The versions the updater compares (src/updater.rs tests); already built
# for Tauri.
semver = "1"

[features]
# Tauri's custom-protocol is enabled for production builds by the CLI.
custom-protocol = ["tauri/custom-protocol"]
