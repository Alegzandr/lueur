[package]
name = "lueur"
description = "Lueur — a low-latency ambilight for smart bulbs, made for cosy night gaming."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "lueur"

# The library the binary and (future) integration tests share.
[lib]
name = "lueur_lib"
crate-type = ["lib"]

[[bin]]
name = "lueur"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lueur-core = { path = "../crates/lueur-core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
# The save and open dialogs of the config export and import, used from Rust
# only (no frontend permission).
tauri-plugin-dialog = "2"
# The updater's timer (a six hour sleep must not hold a thread) and the
# runtime the Tuya driver runs on.
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }

# Tuya / Smart Life (src/tuya.rs, src/tuya_cloud.rs). Local control goes
# through rustuya; the one-off Smart Life sign-in that hands over each bulb's
# local key is an HTTPS API whose payloads are signed and AES-GCM sealed.
rustuya = { version = "0.4.6", features = ["tokio"] }
ureq = { version = "3.5.0", features = ["json"] }
aes-gcm = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
sha2 = "0.11.1"
uuid = { version = "1.29.0", features = ["v4"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

# Cross-platform screen capture (Windows/macOS/Linux). Version pinned by
# `cargo generate-lockfile`; see README for the capture-backend notes.
xcap = "0.9"
# The local time of day, for the natural light (src/natural.rs).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.16"

# Desktop Duplication capture (see src/capture/dxgi.rs) and the per-user
# install (src/install.rs). Same `windows` version xcap already pulls in, so it
# adds no second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
] }
self-replace = "1.5"
winreg = "0.55"

[features]
# Tauri's custom-protocol is enabled for production builds by the CLI.
custom-protocol = ["tauri/custom-protocol"]
