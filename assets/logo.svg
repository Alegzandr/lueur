<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Three lights around a screen, each mirroring its own slice: the product
       model itself. Zone hues match the room plan in the app. -->
  <defs>
    <radialGradient id="glowLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e78a6e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e78a6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBehind" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d1a458" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d1a458" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6ba9c7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ba9c7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <!-- Rounded app tile, neutral anthracite like the app chrome -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#131316"/>

  <!-- The bounce: light spilling onto the wall behind and beside the screen -->
  <g filter="url(#soft)">
    <ellipse cx="146" cy="262" rx="74" ry="132" fill="url(#glowLeft)"/>
    <ellipse cx="256" cy="158" rx="146" ry="70" fill="url(#glowBehind)"/>
    <ellipse cx="366" cy="262" rx="74" ry="132" fill="url(#glowRight)"/>
  </g>

  <!-- The screen -->
  <rect x="152" y="172" width="208" height="146" rx="16" fill="#191a1d"
        stroke="#383a40" stroke-width="4"/>
  <!-- A glimmer on the glass: the lueur -->
  <path d="M180 300 L216 200 L252 300 Z" fill="#eceef2" opacity="0.14"/>

  <!-- Stand -->
  <rect x="240" y="318" width="32" height="24" fill="#282a2f"/>
  <rect x="208" y="340" width="96" height="13" rx="6.5" fill="#282a2f"/>
</svg>
