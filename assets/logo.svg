<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cosy night background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141026"/>
      <stop offset="1" stop-color="#0b0a17"/>
    </linearGradient>
    <!-- Ambilight bleed colours -->
    <radialGradient id="glowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b14bff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b14bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb03a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb03a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20233a"/>
      <stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Ambilight glow bleeding out around the screen -->
  <g filter="url(#soft)">
    <ellipse cx="256" cy="150" rx="150" ry="80"  fill="url(#glowTop)"/>
    <ellipse cx="150" cy="256" rx="80"  ry="150" fill="url(#glowLeft)"/>
    <ellipse cx="362" cy="256" rx="80"  ry="150" fill="url(#glowRight)"/>
    <ellipse cx="256" cy="362" rx="150" ry="80"  fill="url(#glowBottom)"/>
  </g>

  <!-- The screen -->
  <rect x="150" y="168" width="212" height="150" rx="20" fill="url(#screen)"
        stroke="#3a3f63" stroke-width="4"/>
  <!-- A little glimmer on the screen (a "lueur") -->
  <path d="M176 300 L214 196 L250 300 Z" fill="#e9ecff" opacity="0.16"/>
  <circle cx="300" cy="216" r="16" fill="#eaf6ff" opacity="0.35"/>

  <!-- Stand -->
  <rect x="240" y="318" width="32" height="26" fill="#2a2e49"/>
  <rect x="206" y="342" width="100" height="14" rx="7" fill="#2a2e49"/>
</svg>
